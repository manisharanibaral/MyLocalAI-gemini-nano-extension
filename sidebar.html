<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyLocalAI — Gemini Nano Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="sidebar.css" />
</head>

<body>
  <!-- ====== STATUS OVERLAY (shown when model is not ready) ====== -->
  <div id="status-overlay" class="status-overlay hidden">
    <div class="status-card">
      <div class="status-icon-wrap">
        <svg id="status-spinner" class="status-spinner" viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke="url(#grad)" stroke-linecap="round"
            stroke-dasharray="90 150" stroke-dashoffset="0" />
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8B5CF6" />
              <stop offset="100%" stop-color="#06B6D4" />
            </linearGradient>
          </defs>
        </svg>
        <svg id="status-error-icon" class="status-error-icon hidden" viewBox="0 0 24 24" fill="none" stroke="#F87171"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
      </div>
      <h2 id="status-title" class="status-title">Initializing Gemini Nano…</h2>
      <p id="status-message" class="status-message">Checking on-device model availability</p>
      <button id="status-retry-btn" class="btn-retry hidden">Retry</button>
    </div>
  </div>

  <!-- ====== MAIN CHAT UI ====== -->
  <div id="app" class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo-mark">
          <svg viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#logo-grad)" />
            <path d="M8 14c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6" stroke="#fff" stroke-width="2.2"
              stroke-linecap="round" />
            <circle cx="14" cy="14" r="2" fill="#fff" />
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#8B5CF6" />
                <stop offset="1" stop-color="#06B6D4" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-text">
          <h1>MyLocalAI</h1>
          <span id="header-badge" class="header-badge">Connecting…</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-clear" class="icon-btn" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
        </button>
        <button id="btn-history" class="icon-btn" title="Chat History" aria-label="Chat History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-group">
        <div class="settings-inline-header">
          <label class="settings-label" for="saved-prompts">Saved Prompts</label>
          <button id="btn-save-prompt" class="icon-btn icon-btn-sm" title="Save current prompt"
            aria-label="Save current prompt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
        </div>
        <div class="select-wrap">
          <select id="saved-prompts" class="settings-input">
            <option value="" disabled selected>Select a saved prompt...</option>
          </select>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <label class="settings-label" for="sys-prompt">System Prompt</label>
        <textarea id="sys-prompt" class="settings-textarea" rows="3"
          placeholder="e.g. You are a concise coding assistant…"></textarea>
      </div>
      <div class="settings-row">
        <div class="settings-group flex-1">
          <label class="settings-label" for="temp-slider">Temperature <span id="temp-value"
              class="settings-value">0.7</span></label>
          <input id="temp-slider" type="range" min="0" max="1" step="0.1" value="0.7" class="settings-slider" />
        </div>
        <div class="settings-group flex-1">
          <label class="settings-label" for="topk-slider">Top-K <span id="topk-value"
              class="settings-value">40</span></label>
          <input id="topk-slider" type="range" min="1" max="100" step="1" value="40" class="settings-slider" />
        </div>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-section-label">Ollama Fallback (for non-Chrome browsers)</div>
      <div class="settings-row">
        <div class="settings-group flex-1">
          <label class="settings-label" for="ollama-model">Model</label>
          <input id="ollama-model" type="text" class="settings-input" value="gemma3:1b"
            placeholder="gemma3:1b" />
        </div>
        <div class="settings-group flex-1">
          <label class="settings-label" for="ollama-url">Ollama URL</label>
          <input id="ollama-url" type="text" class="settings-input" value="http://localhost:11434"
            placeholder="http://localhost:11434" />
        </div>
      </div>
      <button id="btn-apply-settings" class="btn-apply">Apply & Restart Session</button>
      <button id="btn-reset-all" class="btn-reset">Reset All Data & Settings</button>
    </div>

    <!-- HISTORY PANEL -->
    <div id="history-panel" class="settings-panel history-panel hidden">
      <div class="settings-section-label history-panel-label">Past Conversations</div>
      <div id="history-list" class="history-list">
        <!-- History items will be injected here -->
      </div>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="welcome-screen">
      <div class="welcome-glow"></div>
      <div class="welcome-content">
        <div class="welcome-icon">
          <svg viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="18" fill="url(#wg)" />
            <path d="M18 32c0-7.7 6.3-14 14-14s14 6.3 14 14-6.3 14-14 14" stroke="#fff" stroke-width="3.5"
              stroke-linecap="round" />
            <circle cx="32" cy="32" r="4.5" fill="#fff" />
            <defs>
              <linearGradient id="wg" x1="0" y1="0" x2="64" y2="64">
                <stop stop-color="#8B5CF6" />
                <stop offset="1" stop-color="#06B6D4" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2 class="welcome-title">Hello! I'm your local AI</h2>
        <p id="welcome-sub" class="welcome-sub">Running entirely on your device. Private. Fast. Offline.</p>
        <div class="welcome-chips">
          <button class="chip" data-prompt="Write a professional email">✉️ Write a professional email</button>
          <button class="chip"
            data-prompt="List the top 5 productivity tips for exercising and benefits of exercise with bullet points">📋
            Exercise &amp; productivity tips</button>
          <button class="chip" data-prompt="Explain how HTTPS works step by step">🔐 How HTTPS works</button>
          <button class="chip" data-prompt="Explain quantum computing in detail with bullet points">⚛️ Quantum computing
            explained</button>
        </div>
      </div>
    </div>

    <!-- MESSAGES -->
    <div id="messages" class="messages hidden">
      <!-- messages will be injected here -->
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <!-- CONTEXT CARD -->
      <div id="context-card" class="context-card hidden">
        <span class="context-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </span>
        <span id="context-text" class="context-text"></span>
        <button id="btn-clear-context" class="btn-clear-context" title="Clear context" aria-label="Clear context">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- IMAGE PREVIEW CARD -->
      <div id="image-preview-card" class="context-card hidden">
        <div class="img-thumb">
          <img id="image-preview-img" src="" alt="Attached image preview" />
        </div>
        <span class="context-text img-preview-text">Attached image</span>
        <button id="btn-clear-image" class="btn-clear-context" title="Clear image" aria-label="Clear image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="input-wrap">
        <button id="btn-upload-img" class="icon-btn icon-btn-input" title="Upload Image"
          aria-label="Upload Image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <input type="file" id="file-upload" accept="image/*" hidden />
        <textarea id="user-input" class="user-input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button id="btn-send" class="btn-send" title="Send" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
        <button id="btn-stop" class="btn-stop hidden" title="Stop generating" aria-label="Stop generating">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>
      <p class="input-hint"><span id="backend-hint">100% on-device</span> · <span id="token-info"
          class="token-info"></span></p>
    </div>
  </div>

  <script src="purify.min.js"></script>
  <script src="sidebar.js"></script>
</body>

</html>
